<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Macros" />
  <title>Macro Snap</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="prevDay" aria-label="Previous day">‹</button>
    <h1 id="dayLabel">Today</h1>
    <button class="icon-btn" id="nextDay" aria-label="Next day">›</button>
    <button class="icon-btn settings" id="openSettings" aria-label="Settings">⚙︎</button>
  </header>

  <main>
    <section class="card summary">
      <div class="cal-row">
        <div>
          <div class="cal-big" id="calEaten">0</div>
          <div class="muted">of <span id="calGoal">0</span> kcal</div>
        </div>
        <div class="cal-left"><span id="calLeft">0</span><small>left</small></div>
      </div>
      <div class="bar"><div class="fill cal" id="calBar"></div></div>
      <div class="macros">
        <div class="macro">
          <div class="macro-label">Protein</div>
          <div class="macro-val"><span id="pEaten">0</span>/<span id="pGoal">0</span>g</div>
          <div class="bar"><div class="fill p" id="pBar"></div></div>
        </div>
        <div class="macro">
          <div class="macro-label">Carbs</div>
          <div class="macro-val"><span id="cEaten">0</span>/<span id="cGoal">0</span>g</div>
          <div class="bar"><div class="fill c" id="cBar"></div></div>
        </div>
        <div class="macro">
          <div class="macro-label">Fat</div>
          <div class="macro-val"><span id="fEaten">0</span>/<span id="fGoal">0</span>g</div>
          <div class="bar"><div class="fill f" id="fBar"></div></div>
        </div>
      </div>
    </section>

    <section class="actions">
      <label class="btn primary big">
        📷 Snap a meal
        <input type="file" accept="image/*" capture="environment" id="cameraInput" hidden />
      </label>
      <div class="row">
        <label class="btn">
          🖼 From photos
          <input type="file" accept="image/*" id="libraryInput" hidden />
        </label>
        <button class="btn" id="describeBtn">✏️ Describe it</button>
      </div>
    </section>

    <section>
      <h2 class="section-title">Logged</h2>
      <ul class="entries" id="entries"></ul>
      <p class="muted empty" id="emptyMsg">Nothing logged yet.</p>
    </section>
  </main>

  <!-- Review / analysis sheet -->
  <dialog id="review" class="sheet">
    <form method="dialog" class="sheet-inner" id="reviewForm">
      <div class="sheet-head">
        <button class="link" value="cancel" formnovalidate>Cancel</button>
        <strong>Review meal</strong>
        <span></span>
      </div>

      <img id="preview" alt="" hidden />

      <label class="field">
        <span id="noteLabel">Add a comment (optional, helps accuracy)</span>
        <textarea id="note" rows="2" maxlength="300" placeholder="e.g. half portion, dressing on the side, cooked in olive oil"></textarea>
      </label>
      <div class="prep-actions" id="prepActions">
        <label class="btn" id="retakeBtn">Retake
          <input type="file" accept="image/*" capture="environment" id="retakeInput" hidden />
        </label>
        <button type="button" class="btn" id="analyzeBtn">Analyze</button>
      </div>

      <div id="status" class="status" hidden></div>

      <div id="result" hidden>
        <div class="question" id="question" hidden></div>
        <input class="meal-name" id="mealName" aria-label="Meal name" />
        <ul class="items" id="items"></ul>
        <button type="button" class="link" id="addItem">+ Add item</button>
        <div class="totals" id="totals"></div>
        <p class="muted small" id="aiNotes"></p>
        <button type="button" class="btn primary big" id="logBtn">Log it</button>
      </div>
    </form>
  </dialog>

  <!-- Settings -->
  <dialog id="settings" class="sheet">
    <form method="dialog" class="sheet-inner" id="settingsForm">
      <div class="sheet-head">
        <button class="link" value="cancel" formnovalidate>Close</button>
        <strong>Settings</strong>
        <button class="link" id="saveSettings" value="save">Save</button>
      </div>
      <h3>Daily goals</h3>
      <div class="grid2">
        <label class="field"><span>Calories</span><input type="number" inputmode="numeric" id="gCal" /></label>
        <label class="field"><span>Protein (g)</span><input type="number" inputmode="numeric" id="gP" /></label>
        <label class="field"><span>Carbs (g)</span><input type="number" inputmode="numeric" id="gC" /></label>
        <label class="field"><span>Fat (g)</span><input type="number" inputmode="numeric" id="gF" /></label>
      </div>
      <h3>App password</h3>
      <label class="field"><span>Saved on this device only</span><input type="password" id="pw" autocomplete="current-password" /></label>
      <h3>Data</h3>
      <button type="button" class="btn" id="exportBtn">Download CSV</button>
    </form>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
